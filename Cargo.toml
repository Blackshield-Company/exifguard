[package]
name = "exifguard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Batch forensic verifier for evidence photos — flags signs of editing or tampering via EXIF metadata analysis"
repository = "https://github.com/Blackshield-Company/exifguard"
keywords = ["forensics", "exif", "evidence", "metadata", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
exif = { package = "kamadak-exif", version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
